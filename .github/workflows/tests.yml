name: Core tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tokenizers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[mcp,test,languages]'
      - name: Prepare verified offline tokenizer cache
        run: python scripts/prepare_ci_tokenizer_cache.py --cache-dir "$TIKTOKEN_CACHE_DIR"
      - run: python -m pytest -q
      - name: Exercise installed lexical CLI without models
        run: python scripts/smoke_cpu_cli.py --output results/local/cpu-cli-ci.json
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test ../../tests/test_ordinary_vscode_profile.cjs
