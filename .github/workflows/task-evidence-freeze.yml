name: Task-evidence freeze

on: [push, pull_request]

permissions:
  contents: read

jobs:
  requests-source-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,languages]'
      - name: Prepare the pinned Requests checkout
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/psf/requests.git .cache/corpora/requests
          git -C .cache/corpora/requests checkout --detach 611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60
      - name: Validate the bound source freeze without runtime calls
        run: python scripts/validate_task_evidence_freeze.py
      - name: Exercise source-freeze contracts against the pinned corpus
        run: python -m pytest -q tests/test_task_evidence_freeze.py
