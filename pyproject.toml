[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "Local behavioral code search: H2O MLX model experiment"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
semantic-search = "semantic_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
