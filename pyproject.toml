[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "Local behavioral code search with Qwen embeddings and H2O reranking"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "sqlite-vec==0.1.9", "tiktoken==0.14.0"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
test = ["pytest==8.3.5"]

[project.scripts]
semantic-search = "semantic_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
